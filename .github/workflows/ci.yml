name: CI

# Runs on every pull request into main, and on main itself so the branch always has a
# known-good result to compare against.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

# One job, not two.
#
# Verification and packaging were split so a failing test would not wait on a release
# build - but packaging needed verification to pass first, so the two never ran in
# parallel and the split bought nothing while paying twice for checkout, JDK, Gradle and
# the Android SDK. The steps below still run cheapest-first, so a syntax error or a broken
# test still fails in a couple of minutes; it just does so without a second machine.
jobs:
  ci:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Compiles settings.gradle.kts and every build.gradle.kts without building anything.
      # A syntax error or a bad plugin coordinate fails here, in seconds, with a clear
      # message - before the Android tooling has run at all.
      - name: Gradle script syntax
        run: ./gradlew help --quiet

      # Both distributions. A change that compiles for one and not the other is exactly
      # what the split makes possible, so both are built on every pull request.
      - name: Kotlin compile (both flavours + tests)
        run: >
          ./gradlew
          :app:compileFdroidDebugKotlin :app:compilePlaystoreDebugKotlin
          :app:compileFdroidDebugUnitTestKotlin :app:compilePlaystoreDebugUnitTestKotlin
          --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintFdroidDebug :app:lintPlaystoreDebug

      - name: Unit tests
        run: ./gradlew :app:testSummary :app:verifyTestFloor --stacktrace

      # Packaging runs on main only.
      #
      # A pull request is answering "is this change correct?", and the steps above answer
      # it. Assembling both variants - R8 included - was adding several minutes to every
      # PR to re-prove something no PR had changed. On main it still runs on every merge,
      # so a shrinking problem is caught within one commit of arriving rather than at tag
      # time.
      # The debug build of what ships from GitHub, plus a release pass through R8 for
      # both distributions. Four full variants would re-prove the same shrinking twice.
      - name: Assemble debug and release
        if: github.event_name == 'push'
        run: >
          ./gradlew
          :app:assembleFdroidDebug
          :app:assembleFdroidRelease :app:assemblePlaystoreRelease
          --stacktrace

      # The test count is read from the JUnit XML, so the number on the PR is always the
      # number that actually ran.
      - name: Publish summary
        if: always()
        run: |
          if [ -f app/build/test-summary.md ]; then
            cat app/build/test-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if compgen -G "app/build/outputs/apk/*/*/*.apk" > /dev/null; then
            {
              echo
              echo "### APK size"
              echo
              echo "| Variant | Size |"
              echo "|---------|-----:|"
              for apk in app/build/outputs/apk/*/*/*.apk; do
                echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
